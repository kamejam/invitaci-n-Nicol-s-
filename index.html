<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Invitación al Cumpleaños de Nicolás Orozco! ⚽🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --verde-campo: #138841;
  --azul-champions: #0052cc;
  --rojo-pasion: #ff2a4b;
  --amarillo-gol: #ffcc00;
  --texto: #1a2e22;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }

body{
  font-family: 'Fredoka', sans-serif;
  overflow-x:hidden;
  background-image: 
    linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.8) 100%),
    url('https://i.ibb.co/7J8p3cYK/estadio-futbol-puesta-sol-campo-verde-lineas-blancas-23-2151976034.jpg');
  background-attachment: fixed;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 15px;
}

.hero-content{
  position:relative;
  z-index:2;
  width:min(850px,95%);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border: 6px solid var(--amarillo-gol);
  border-radius: 40px;
  padding: 40px 20px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.ball-header { font-size: 60px; margin-bottom: 10px; display:inline-block; }

.badge-tag {
  display: inline-block;
  background: var(--azul-champions);
  color: white;
  padding: 8px 22px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 20px;
}

/* --- ESTILO PARA LA IMAGEN REAL DE SNOOPY --- */
.snoopy-container {
  width: 180px; /* Ancho de la imagen */
  margin: 0 auto 20px; /* Centrado */
}

.snoopy-img {
  width: 100%;
  height: auto;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3)); /* Sombra para que resalte */
}

h1{
  font-family: 'Outfit', sans-serif;
  font-size: clamp(45px, 9vw, 80px);
  font-weight: 900;
  line-height: 0.95;
  color: var(--azul-champions);
  text-transform: uppercase;
  text-shadow: 3px 3px 0px var(--amarillo-gol);
}

.name{ color: var(--rojo-pasion); text-shadow: 3px 3px 0px var(--texto); }

.age-badge {
  width: 85px; height: 85px; margin: 15px auto;
  background: linear-gradient(135deg, var(--amarillo-gol), #ff9900);
  border: 4px solid var(--azul-champions);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Outfit', sans-serif; font-size: 50px; font-weight: 900;
  color: var(--azul-champions); box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.hero-text{ font-size: 19px; line-height: 1.5; font-weight: 600; color: #333; margin-top: 15px;}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-content">
    
    <div class="ball-header">⚽</div>
    
    <div>
      <span class="badge-tag">¡Estás invitado al partido!</span>
    </div>

    <!-- === AQUÍ ESTÁ LA IMAGEN REAL Y CLÁSICA DE SNOOPY === -->
    <div class="snoopy-container">
      <img src="https://i.ibb.co/2vX33mS/snoopy-house.png" alt="Snoopy en su casita" class="snoopy-img">
    </div>

    <h1>Nicolás<br><span class="name">Orozco</span></h1>

    <div class="age-badge">8</div>

    <p class="hero-text">
      🎉 ¡Prepara tus tenis! Vamos a celebrar un cumpleaños lleno de goles, juegos y mucha diversión. 🎉
    </p>

  </div>
</header>

</body>
</html>
