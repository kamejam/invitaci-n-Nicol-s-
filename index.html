<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Nicolás cumple 8! ⚽🎂</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Trebuchet MS",Arial,sans-serif;
  background:#16833c;
  color:#17351e;
  overflow-x:hidden;
}

/* =========================
   CONFETI
========================= */

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-20px;
  z-index:50;
  pointer-events:none;
  animation:caer linear infinite;
}

.c1{left:5%;background:#ffd21c;animation-duration:6s}
.c2{left:15%;background:#e53935;animation-duration:8s}
.c3{left:27%;background:#0754a6;animation-duration:7s}
.c4{left:39%;background:white;animation-duration:9s}
.c5{left:53%;background:#ffd21c;animation-duration:6.5s}
.c6{left:67%;background:#e53935;animation-duration:8.5s}
.c7{left:78%;background:#0754a6;animation-duration:7.5s}
.c8{left:91%;background:white;animation-duration:9.5s}

@keyframes caer{
  0%{
    transform:translateY(-20px) rotate(0deg);
  }
  100%{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* =========================
   PORTADA
========================= */

.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px 15px;
  background:
    linear-gradient(
      rgba(17,130,60,.78),
      rgba(17,130,60,.88)
    ),
    repeating-linear-gradient(
      90deg,
      #31994e 0,
      #31994e 90px,
      #278c45 90px,
      #278c45 180px
    );
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:90%;
  height:80%;
  border:5px solid rgba(255,255,255,.8);
  border-radius:35px;
}

.hero-content{
  position:relative;
  z-index:2;
  width:min(900px,95%);
  background:#fffdf1;
  border:6px solid white;
  border-radius:40px;
  padding:35px 20px 40px;
  text-align:center;
  box-shadow:0 25px 60px #0006;
}

.ball{
  font-size:70px;
  animation:rebote 1.8s infinite ease-in-out;
}

@keyframes rebote{
  0%,100%{
    transform:translateY(0) rotate(0);
  }
  50%{
    transform:translateY(-18px) rotate(12deg);
  }
}

/* casita roja */

.doghouse{
  width:190px;
  height:115px;
  background:#e53935;
  margin:15px auto 5px;
  position:relative;
  border:5px solid #17351e;
  border-radius:12px 12px 5px 5px;
  animation:flotar 3s infinite ease-in-out;
}

.doghouse::before{
  content:"";
  position:absolute;
  left:-12px;
  top:-75px;
  width:205px;
  height:100px;
  background:#d62828;
  border:5px solid #17351e;
  transform:skewY(-28deg);
  border-radius:15px 15px 0 0;
}

.doghouse::after{
  content:"";
  position:absolute;
  width:55px;
  height:65px;
  bottom:-5px;
  left:65px;
  background:#8f241e;
  border:4px solid #17351e;
  border-radius:50px 50px 0 0;
}

@keyframes flotar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.snoopy-placeholder{
  position:absolute;
  top:-55px;
  left:50%;
  transform:translateX(-50%);
  font-size:65px;
  z-index:3;
}

.small-title{
  margin-top:25px;
  color:#0754a6;
  font-size:20px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:3px;
}

h1{
  font-size:clamp(45px,9vw,88px);
  line-height:.9;
  margin:15px 0;
  color:#0754a6;
  text-shadow:4px 4px 0 #ffd21c;
}

.name{
  color:#e53935;
}

.age{
  display:flex;
  align-items:center;
  justify-content:center;
  width:115px;
  height:115px;
  margin:20px auto;
  background:#ffd21c;
  border:7px solid #0754a6;
  border-radius:50%;
  font-size:65px;
  font-weight:900;
  color:#e53935;
  animation:pulso 1.5s infinite;
}

@keyframes pulso{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.hero-text{
  font-size:21px;
  line-height:1.5;
  font-weight:800;
}

.button{
  display:inline-block;
  margin:20px 6px 0;
  padding:15px 24px;
  background:#0754a6;
  color:white;
  text-decoration:none;
  border-radius:50px;
  font-weight:900;
  box-shadow:0 6px 0 #04366e;
  transition:.2s;
}

.button:hover{
  transform:translateY(4px);
  box-shadow:0 2px 0 #04366e;
}

/* =========================
   SECCIONES
========================= */

section{
  padding:70px 18px;
}

.container{
  max-width:1100px;
  margin:auto;
}

.section-title{
